services:
  - type: web
    name: meraki-ai-voice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn meraki.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
    # No API keys here on purpose. Every visitor brings their own through the
    # Keys dialog, so the deployment costs nothing to run and nobody spends
    # anyone else's quota. To host a demo that works on first click instead,
    # add DEEPGRAM_API_KEY, OLLAMA_API_KEY and MURF_API_KEY in the Render
    # dashboard - visitors then fall back to those unless they enter their own.
