services:
  - type: web
    name: meraki-ai-voice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn meraki.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # sync: false means Render prompts for these at deploy time and keeps them
      # out of the repo. Without all three the app starts but every conversation
      # fails on the handshake.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
