<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>{{ app_name }} — Voice Agent</title>
  <meta name="description" content="A real-time voice agent: streaming speech recognition, streaming language model, streaming speech synthesis." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#x1F577;</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_v }}" />
</head>
<body data-state="idle">

  <div class="rule" aria-hidden="true"></div>

  <header class="bar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 8.4v7.2M8.6 10.4 12 12l3.4-1.6M8.6 13.6 12 12l3.4 1.6" />
          <path d="M12 8.4 8.1 4.9M12 8.4l3.9-3.5M8.6 10.4 3.6 8.7M15.4 10.4l5-1.7M8.6 13.6l-5 1.7M15.4 13.6l5 1.7M12 15.6l-3.9 3.5M12 15.6l3.9 3.5" />
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">{{ app_name }}</span>
        <span class="brand__tag">{{ tagline }}</span>
      </span>
    </div>

    <div class="chips">
      <span class="chip chip--mono">Deepgram <i>·</i> Ollama <i>·</i> Murf</span>
      <span class="chip chip--status">
        <span id="status-dot" class="chip__dot" data-state="idle" aria-hidden="true"></span>
        <span id="status">Ready</span>
      </span>
    </div>
  </header>

  <main class="stage">
    <p class="stage__eyebrow">Real-time voice</p>
    <h1 class="stage__title">Talk to it.<br /><em>It talks back.</em></h1>

    <canvas id="meter" class="meter" aria-hidden="true"></canvas>

    <section id="live" class="live" aria-live="polite" hidden>
      <p id="live-user" class="live__user"></p>
      <p id="live-reply" class="live__reply"></p>
    </section>

    <div class="controls">
      <button id="mic-btn" class="mic" type="button" data-active="false">
        <span class="mic__ring" aria-hidden="true"></span>
        <svg class="mic__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="11" rx="3" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
        </svg>
        <span id="mic-label">Start talking</span>
      </button>
      <p id="hint" class="hint">Click to start a conversation</p>
    </div>
  </main>

  <section class="log">
    <div class="log__head">
      <h2>Conversation</h2>
      <button id="clear-btn" class="ghost" type="button">Clear</button>
    </div>
    <p id="empty" class="log__empty">Nothing yet. Press the button and say something.</p>
    <div id="transcript" class="log__body"></div>
  </section>

  <footer class="foot">
    <span>Streaming STT <i>→</i> LLM <i>→</i> TTS over one WebSocket</span>
    <span class="foot__right">v{{ version }}</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script type="module" src="/static/js/app.js?v={{ asset_v }}"></script>
</body>
</html>
